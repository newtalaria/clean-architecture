  - id: sp-hy-presentation
    path: serverpod/hybrid/presentation.md
    title: Presentation
    description: A thin save method maps the wire input, calls the use case, and maps ValidationFailure to a 400.
    tags: [clean-architecture, serverpod]

  - id: sp-hy-composition
    path: serverpod/hybrid/composition.md
    title: Composition root
    description: UseCases is the only type that constructs NoteRepositoryImpl.
    tags: [clean-architecture, serverpod]

  - id: sp-hy-tests
    path: serverpod/hybrid/tests.md
    title: Tests
    description: A domain test, a fake-repository use case test, and one test through the endpoint into the store.
    tags: [clean-architecture, serverpod]

  - id: sp-hy-talaria
    path: serverpod/hybrid/talaria.md
    title: Talaria
    description: Initialize talaria_serverpod when TALARIA_API_KEY is set, and attach it on the Serverpod constructor.
    tags: [clean-architecture, serverpod]

  - id: flutter
    path: flutter/README.md
    title: Flutter
    description: One notes client, built three times. Pick hybrid, layer-first, or feature-first, then instrument it.
    tags: [clean-architecture, flutter]

  - id: fl-hy
    path: flutter/hybrid/README.md
    title: Hybrid
    description: Domain, application, and data stay horizontal. The notes screen is a feature. The tile does not import Riverpod.
    tags: [clean-architecture, flutter]

  - id: fl-hy-pros-and-cons
    path: flutter/hybrid/pros-and-cons.md
    title: Pros and cons
    description: What you gain when the domain stays shared and screens are local, and the two rules you have to remember.
    tags: [clean-architecture, flutter]

  - id: fl-hy-when-to-use
    path: flutter/hybrid/when-to-use.md
    title: When to use it
    description: Choose hybrid when most changes are screens and the domain is still shared.
    tags: [clean-architecture, flutter]

  - id: fl-hy-domain
    path: flutter/hybrid/domain.md
    title: Domain
    description: The note entity and the repository port, with no Flutter import.
    tags: [clean-architecture, flutter]

  - id: fl-hy-application
    path: flutter/hybrid/application.md
    title: Application
    description: SaveNoteUseCase takes the repository port, a clock, and an id generator.
    tags: [clean-architecture, flutter]

  - id: fl-hy-data
    path: flutter/hybrid/data.md
    title: Data
    description: An in-memory store, a row type, and a mapper. This is where the API client would sit.
    tags: [clean-architecture, flutter]

  - id: fl-hy-presentation
    path: flutter/hybrid/presentation.md
    title: Presentation
    description: A Riverpod notifier calls the use case. The note tile does not import Riverpod. Beamer reports the screen.
    tags: [clean-architecture, flutter]

  - id: fl-hy-composition
    path: flutter/hybrid/composition.md
    title: Composition root
    description: app/providers.dart is the only file that constructs NoteRepositoryImpl.
    tags: [clean-architecture, flutter]

  - id: fl-hy-tests
    path: flutter/hybrid/tests.md
    title: Tests
    description: A domain test, a fake-repository use case test, a page test, and a tile test with no provider scope.
    tags: [clean-architecture, flutter]

  - id: fl-hy-talaria
    path: flutter/hybrid/talaria.md
    title: Talaria
    description: Initialize talaria_flutter when TALARIA_API_KEY is set, in one zone with runApp.
    tags: [clean-architecture, flutter]

  - id: fl-lf
    path: flutter/layer-first/README.md
